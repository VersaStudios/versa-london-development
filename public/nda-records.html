<!DOCTYPE html>
<html>
<head>
  <title>NDA Records — Versa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f3; font-family: Arial, sans-serif; min-height: 100vh; }

    /* Access gate */
    #gate {
      position: fixed; inset: 0; background: #1a1a1a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000;
    }
    #gate img { width: 140px; margin-bottom: 32px; }
    #keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
    .kp-btn {
      height: 72px; font-size: 26px; font-weight: bold; border-radius: 14px;
      border: none; background: #2a2a2a; color: white; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background 0.1s;
    }
    .kp-btn:active { background: #3a3a3a; }
    #kpDisplay {
      width: 226px; margin-bottom: 16px; padding: 16px; background: #111;
      border-radius: 14px; color: white; font-size: 28px; font-weight: bold;
      text-align: center; letter-spacing: 0.3em; min-height: 64px;
    }
    #kpError { color: #e55; font-size: 14px; margin-top: 12px; min-height: 1.2em; }

    /* Main */
    #main { display: none; padding-bottom: 40px; }
    #header { background: #1a1a1a; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    #header img { height: 36px; }
    #header h1 { color: white; font-family: 'Bebas Neue', Arial; font-size: 22px; letter-spacing: 0.05em; }
    #headerRight { display: flex; gap: 10px; align-items: center; }
    .export-btn { padding: 8px 16px; background: #2a5a2a; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
    #content { max-width: 1000px; margin: 0 auto; padding: 20px; }

    /* Stats */
    #stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat { background: white; border-radius: 12px; padding: 16px 20px; flex: 1; min-width: 120px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-num { font-size: 32px; font-weight: bold; color: #1a1a1a; font-family: 'Bebas Neue', Arial; }
    .stat-label { font-size: 12px; color: #888; margin-top: 2px; }

    /* Filters */
    #filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    #filters input, #filters select {
      padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 10px;
      font-size: 14px; outline: none; background: white;
    }
    #filters input { flex: 1; min-width: 180px; }
    #filters input:focus, #filters select:focus { border-color: #1a1a1a; }

    /* Table */
    #tableWrap { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th { background: #1a1a1a; color: white; padding: 14px 16px; text-align: left; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
    td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .nda-yes { color: #2a7a2a; font-weight: bold; }
    .nda-no { color: #c00; }
    .type-visitor { background: #e8f4e8; color: #2a7a2a; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; display: inline-block; }
    .type-staff { background: #e8e8f4; color: #2a2a7a; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; display: inline-block; }
    #loading { text-align: center; padding: 40px; color: #888; font-size: 16px; }
    #noResults { text-align: center; padding: 40px; color: #888; }

    /* Modal */
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    #modal.open { display: flex; }
    #modalBox { background: white; border-radius: 20px; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 28px; }
    #modalBox h2 { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
    .detail-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-size: 12px; color: #888; font-weight: bold; text-transform: uppercase; width: 120px; flex-shrink: 0; padding-top: 2px; }
    .detail-value { font-size: 15px; color: #1a1a1a; flex: 1; word-break: break-word; }
    .sig-display { font-family: 'Georgia', serif; font-size: 20px; color: #1a1a1a; font-style: italic; }
    #closeModal { width: 100%; padding: 14px; margin-top: 20px; background: #1a1a1a; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Access gate -->
  <div id="gate">
    <img src="Versa Logo.png" alt="Versa">
    <div id="kpDisplay"></div>
    <div id="keypad">
      <button class="kp-btn" onclick="kpPress('1')">1</button>
      <button class="kp-btn" onclick="kpPress('2')">2</button>
      <button class="kp-btn" onclick="kpPress('3')">3</button>
      <button class="kp-btn" onclick="kpPress('4')">4</button>
      <button class="kp-btn" onclick="kpPress('5')">5</button>
      <button class="kp-btn" onclick="kpPress('6')">6</button>
      <button class="kp-btn" onclick="kpPress('7')">7</button>
      <button class="kp-btn" onclick="kpPress('8')">8</button>
      <button class="kp-btn" onclick="kpPress('9')">9</button>
      <button class="kp-btn" onclick="kpPress('clear')">⌫</button>
      <button class="kp-btn" onclick="kpPress('0')">0</button>
      <button class="kp-btn" onclick="kpPress('enter')">→</button>
    </div>
    <div id="kpError"></div>
  </div>

  <!-- Main content -->
  <div id="main">
    <div id="header">
      <img src="Versa Logo.png" alt="Versa">
      <h1>NDA Records</h1>
      <div id="headerRight">
        <button class="export-btn" onclick="exportCSV()">Export CSV</button>
      </div>
    </div>

    <div id="content">
      <div id="stats">
        <div class="stat"><div class="stat-num" id="statTotal">—</div><div class="stat-label">Total Records</div></div>
        <div class="stat"><div class="stat-num" id="statVisitors">—</div><div class="stat-label">Visitors</div></div>
        <div class="stat"><div class="stat-num" id="statStaff">—</div><div class="stat-label">Staff / Crew</div></div>
        <div class="stat"><div class="stat-num" id="statToday">—</div><div class="stat-label">Today</div></div>
      </div>

      <div id="filters">
        <input id="searchInput" type="text" placeholder="Search name, company, email..." oninput="filterRecords()">
        <select id="typeFilter" onchange="filterRecords()">
          <option value="">All Types</option>
          <option value="visitor">Visitors</option>
          <option value="staff">Staff / Crew</option>
        </select>
      </div>

      <div id="tableWrap">
        <div id="loading">Loading records...</div>
        <table id="recordsTable" style="display:none">
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Company</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Signed</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
        <div id="noResults" style="display:none">No records found</div>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div id="modal">
    <div id="modalBox">
      <h2 id="modalName"></h2>
      <div id="modalDetails"></div>
      <button id="closeModal" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    var ACCESS_CODE = '1956';
    var kpValue = '';
    var allRecords = [];

    // Keypad
    function kpPress(v) {
      if (v === 'clear') { kpValue = kpValue.slice(0,-1); }
      else if (v === 'enter') { checkCode(); return; }
      else { kpValue += v; }
      document.getElementById('kpDisplay').textContent = '●'.repeat(kpValue.length);
      if (kpValue.length === ACCESS_CODE.length) setTimeout(checkCode, 200);
    }
    function checkCode() {
      if (kpValue === ACCESS_CODE) {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('main').style.display = 'block';
        loadRecords();
      } else {
        document.getElementById('kpError').textContent = 'Incorrect code';
        kpValue = ''; document.getElementById('kpDisplay').textContent = '';
        setTimeout(function(){ document.getElementById('kpError').textContent = ''; }, 1500);
      }
    }

    async function loadRecords() {
      try {
        var r = await fetch('/api/nda-records');
        allRecords = await r.json();
        renderRecords(allRecords);
        updateStats(allRecords);
      } catch(e) {
        document.getElementById('loading').textContent = 'Could not load records.';
      }
    }

    function updateStats(records) {
      var today = new Date().toDateString();
      document.getElementById('statTotal').textContent = records.length;
      document.getElementById('statVisitors').textContent = records.filter(function(r){ return r.is_visitor; }).length;
      document.getElementById('statStaff').textContent = records.filter(function(r){ return !r.is_visitor; }).length;
      document.getElementById('statToday').textContent = records.filter(function(r){ return new Date(r.agreed_at).toDateString() === today; }).length;
    }

    function renderRecords(records) {
      document.getElementById('loading').style.display = 'none';
      if (records.length === 0) {
        document.getElementById('noResults').style.display = 'block';
        document.getElementById('recordsTable').style.display = 'none';
        return;
      }
      document.getElementById('noResults').style.display = 'none';
      document.getElementById('recordsTable').style.display = 'table';
      var tbody = document.getElementById('recordsBody');
      tbody.innerHTML = '';
      records.forEach(function(rec) {
        var tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(){ showDetail(rec); };
        var date = new Date(rec.agreed_at).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
        tr.innerHTML =
          '<td><strong>' + esc(rec.name) + '</strong></td>' +
          '<td><span class="' + (rec.is_visitor ? 'type-visitor' : 'type-staff') + '">' + (rec.is_visitor ? 'Visitor' : 'Staff') + '</span></td>' +
          '<td>' + esc(rec.company||'—') + '</td>' +
          '<td>' + esc(rec.email||'—') + '</td>' +
          '<td>' + esc(rec.phone||'—') + '</td>' +
          '<td class="nda-yes">✓ Signed</td>' +
          '<td>' + date + '</td>';
        tbody.appendChild(tr);
      });
    }

    function filterRecords() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var type = document.getElementById('typeFilter').value;
      var filtered = allRecords.filter(function(r) {
        var matchQ = !q || (r.name||'').toLowerCase().includes(q) || (r.company||'').toLowerCase().includes(q) || (r.email||'').toLowerCase().includes(q);
        var matchType = !type || (type === 'visitor' && r.is_visitor) || (type === 'staff' && !r.is_visitor);
        return matchQ && matchType;
      });
      renderRecords(filtered);
    }

    function showDetail(rec) {
      document.getElementById('modalName').textContent = rec.name;
      var date = new Date(rec.agreed_at).toLocaleString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
      document.getElementById('modalDetails').innerHTML =
        row('Type', rec.is_visitor ? 'Visitor' : 'Staff / Crew') +
        row('Company', rec.company||'—') +
        row('Email', rec.email||'—') +
        row('Phone', rec.phone||'—') +
        (rec.job_title ? row('Job Title', rec.job_title) : '') +
        row('NDA Agreed', '✓ Yes') +
        row('Date & Time', date) +
        row('Signature', '<span class="sig-display">' + esc(rec.signature) + '</span>') +
        (rec.ip_address ? row('IP Address', rec.ip_address) : '');
      document.getElementById('modal').classList.add('open');
    }

    function row(label, value) {
      return '<div class="detail-row"><div class="detail-label">' + label + '</div><div class="detail-value">' + value + '</div></div>';
    }

    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    function exportCSV() {
      var rows = [['Name','Type','Company','Email','Phone','Job Title','Signed','Date','IP Address','Signature']];
      allRecords.forEach(function(r) {
        var date = new Date(r.agreed_at).toLocaleString('en-GB');
        rows.push([r.name, r.is_visitor?'Visitor':'Staff', r.company||'', r.email||'', r.phone||'', r.job_title||'', 'Yes', date, r.ip_address||'', r.signature||'']);
      });
      var csv = rows.map(function(r){ return r.map(function(c){ return '"'+(c||'').replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
      var blob = new Blob([csv], {type:'text/csv'});
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'nda-records-' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
    }

    function esc(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  </script>
</body>
</html>
